<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;background:#F8F6F0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
button{font-family:inherit;cursor:pointer;}
textarea{font-family:inherit;}
#app{max-width:480px;margin:0 auto;min-height:100vh;}
.hdr{background:#1B3F8B;position:sticky;top:0;z-index:10;box-shadow:0 4px 16px rgba(27,63,139,.35);}
.hdr-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;}
.logo{background:transparent;padding:0;}
.logo-t{font-size:24px;font-weight:900;color:#F5C800;letter-spacing:0.5px;}
.usr-row{display:flex;gap:8px;}
.usr-btn{width:48px;height:48px;border-radius:14px;border:3px solid transparent;transition:all .18s;background:rgba(255,255,255,.18);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0;}
.usr-btn.on{transform:scale(1.08);}
.journey{display:flex;align-items:center;gap:5px;padding:4px 16px 8px;}
.j-dot{width:36px;height:36px;border-radius:8px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;transition:all .18s;background:none;}
.j-dot.on{transform:scale(1.15);box-shadow:0 4px 12px rgba(0,0,0,.3);}
.j-cnt{font-size:13px;color:rgba(255,255,255,.5);margin-left:auto;font-weight:700;}
.tabs{display:flex;border-top:1px solid rgba(255,255,255,.15);}
.tab{flex:1;padding:11px 0;background:transparent;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.45);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
.tab.on{color:#F5C800;border-bottom-color:#F5C800;}
.body{padding:16px 16px 80px;}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.strip{display:flex;gap:7px;margin-bottom:16px;}
.strip-btn{flex:1;height:58px;border-radius:12px;border:2.5px solid;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;transition:all .18s;}
.strip-btn.on{transform:translateY(-4px) scale(1.06);}
.check-item{width:100%;display:flex;align-items:flex-start;gap:14px;padding:14px 12px;border-radius:14px;border:2px solid;margin-bottom:10px;transition:all .15s;text-align:left;}
.check-circle{width:30px;height:30px;border-radius:50%;border:2.5px solid;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;transition:all .15s;}
.tag-badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 9px;margin-bottom:6px;}
.streak-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.streak-name{display:flex;align-items:center;justify-content:center;padding:6px 12px;border-radius:20px;min-width:66px;flex-shrink:0;font-size:16px;font-weight:900;}
.streak-dots{display:flex;gap:4px;flex:1;}
.streak-dot{flex:1;height:16px;border-radius:4px;transition:background .25s;}
.step-row{display:flex;gap:6px;margin-bottom:16px;}
.step-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;transition:all .2s;}
.week-card{border-radius:16px;padding:16px;margin-bottom:12px;border:2.5px solid;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.toast-el{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1B3F8B;color:#fff;padding:12px 26px;border-radius:30px;font-size:16px;font-weight:800;z-index:100;box-shadow:0 6px 24px rgba(27,63,139,.4);pointer-events:none;white-space:nowrap;}
.overlay{position:fixed;inset:0;background:rgba(27,63,139,.7);display:flex;align-items:center;justify-content:center;z-index:200;}
.pop-box{background:#fff;border-radius:22px;max-width:340px;width:90%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.pop-bar{background:#F5C800;padding:22px 24px;text-align:center;font-size:28px;font-weight:900;color:#1B3F8B;}
.pop-body{padding:28px 28px 20px;}
.msn-bar{height:10px;background:#E8EDF5;border-radius:5px;overflow:hidden;margin-bottom:4px;}
.msn-fill{height:100%;background:#7BC87A;border-radius:5px;transition:width .4s;}
textarea{width:100%;border-radius:14px;padding:14px 16px;font-size:17px;color:#0D1F50;outline:none;resize:vertical;line-height:1.7;}
</style>
</head>

// ── helpers ──────────────────────────────────────────────────────────────────
function ds(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().split("T")[0];}
function wk(){const d=new Date(),day=d.getDay(),m=new Date(d);m.setDate(d.getDate()-day+(day===0?-6:1));return m.toISOString().split("T")[0];}
function fd(ts){return new Date(ts).toLocaleDateString("ja-JP",{month:"long",day:"numeric"});}
function dayDone(ch,u,h,lv,dk){const its=H.find(x=>x.id===h)?.levels[lv]?.items||[];return its.length>0&&its.every((_,i)=>!!ch[`${u}_${dk}_${h}_${lv}_${i}`]);}
function calcStreak(ch,u,h,lv){let s=0;for(let d=0;d<30;d++){if(dayDone(ch,u,h,lv,ds(-d)))s++;else break;}return s;}
function getLevel(p,u,h){return p[`${u}_${h}_level`]??0;}
function isUnlocked(p,h){return h===1||p[`both_${h-1}_complete`]===true;}
function ld(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

  const [pr,sPr]=useState(()=>ld("y7p")||{});
  const [ins,sIns]=useState(()=>ld("y7i")||{});
  const [msn,sMsn]=useState(()=>ld("y7m")||{});
  const [mqi,sMqi]=useState(0);
  const [md,sMd]=useState("");
  const [draft,sDraft]=useState("");
  const [toast,sToast]=useState(null);
  const [pop,sPop]=useState(null);
  const today=ds(0),wkey=wk();

  const saveCh=n=>{sCh(n);sv("y7c",n);};
  const savePr=n=>{sPr(n);sv("y7p",n);};
  const saveIns=n=>{sIns(n);sv("y7i",n);};
  const saveMsn=n=>{sMsn(n);sv("y7m",n);};
  const showToast=(m,d=2600)=>{sToast(m);setTimeout(()=>sToast(null),d);};

  const toggle=(hid,lv,idx)=>{
    const k=`${me}_${today}_${hid}_${lv}_${idx}`;
    const nx={...ch,[k]:!ch[k]};saveCh(nx);
    const its=H.find(x=>x.id===hid).levels[lv].items;
    if(!its.every((_,i)=>!!nx[`${me}_${today}_${hid}_${lv}_${i}`]))return;
    const s=calcStreak(nx,me,hid,lv);
    if(s>=7)advance(nx,hid,lv);else showToast(`${s}日連続！あと${7-s}日`);
  };

  const advance=(cur,hid,lv)=>{
    const hab=H.find(x=>x.id===hid),max=hab.levels.length-1,nx={...pr},pt=USERS.find(u=>u.id!==me);
    if(lv<max){nx[`${me}_${hid}_level`]=lv+1;savePr(nx);showToast(`${hab.levels[lv+1].step}に進んだ！`);}
    else{
      nx[`${me}_${hid}_complete`]=true;
      if(nx[`${pt.id}_${hid}_complete`]){nx[`both_${hid}_complete`]=true;savePr(nx);if(hid<7)sPop(hid+1);else showToast("全7習慣コンプリート！！");}
      else{savePr(nx);showToast(`習慣${hid}クリア！${pt.name}さんを待っています`);}
    }
  };

  const isCh=(hid,lv,idx)=>!!ch[`${me}_${today}_${hid}_${lv}_${idx}`];
  const postIns=()=>{if(!draft.trim())return;const k=`${me}_${wkey}`;saveIns({...ins,[k]:[...(ins[k]||[]),{text:draft.trim(),ts:Date.now()}]});sDraft("");showToast("投稿しました");};

  const hab=H.find(x=>x.id===ah);
  const meU=USERS.find(u=>u.id===me),pt=USERS.find(u=>u.id!==me);
  const isUn=isUnlocked(pr,ah),lv=getLevel(pr,me,ah),sk=calcStreak(ch,me,ah,lv);
  const myDn=pr[`${me}_${ah}_complete`]===true,btDn=pr[`both_${ah}_complete`]===true;
  const its=isUn?(hab.levels[lv]?.items||[]):[];
  const tdDn=its.length>0&&its.every((_,i)=>isCh(ah,lv,i));
  const clr=H.filter(x=>pr[`both_${x.id}_complete`]).length;

  const tagInfo=(tag)=>tag==="🧠"?{bg:"#E8F0FC",col:P.navy,lbl:"🧠 理解"}:tag==="✋"?{bg:P.greenPale,col:"#2E7A2E",lbl:"✋ 行動"}:{bg:"#FFF3E8",col:"#A05A00",lbl:"💭 振り返り"};

  return html`
    <div>
      <!-- HEADER -->
      <div class="hdr">
        <div class="hdr-top">
          <div class="logo">
            <div class="logo-t">7 Habits</div>
          </div>
          <div class="usr-row">
            ${USERS.map(u=>html`
              <button class="usr-btn ${me===u.id?'on':''}" onClick=${()=>sMe(u.id)}
                style="background:${me===u.id?u.color:'rgba(255,255,255,.18)'};color:${me===u.id?u.tc:'#fff'};border-color:${me===u.id?P.yellow:'transparent'};">
                ${u.name[0]}
              </button>`)}
          </div>
        </div>
        <!-- Journey dots -->
        <div class="journey">
          ${H.map(x=>{const un=isUnlocked(pr,x.id),bt=pr[`both_${x.id}_complete`],on=ah===x.id;return html`
            <button class="j-dot ${on?'on':''}" onClick=${()=>{sAh(x.id);sTab("today");}}
              style="background:${bt?P.yellow:un?'rgba(255,255,255,.25)':'rgba(255,255,255,.08)'};border-color:${on?'#fff':'transparent'};">
              ${bt?'✓':un?x.id:'🔒'}
            </button>`;})}
          <span class="j-cnt">${clr}/7</span>
        </div>
        <!-- Tabs -->
        <div class="tabs">
          ${[["today","今日"],["weekly","週次"],["share","ふたりで"],["mission","ミッション"]].map(([id,lbl])=>html`
            <button class="tab ${tab===id?'on':''}" onClick=${()=>sTab(id)}>${lbl}</button>`)}
        </div>
      </div>

      <!-- BODY -->
      <div class="body">

        <!-- TODAY -->
        ${tab==="today"&&html`<div>
          <!-- strip -->
          <div class="strip">
            ${H.map(x=>{const un=isUnlocked(pr,x.id),on=ah===x.id,bt=pr[`both_${x.id}_complete`];return html`
              <button class="strip-btn ${on?'on':''}" onClick=${()=>sAh(x.id)}
                style="background:${on?P.green:bt?P.yellow:un?P.greenPale:P.lockedBg};border-color:${on?P.green:bt?P.yellow:un?P.green:P.locked};color:${on?'#fff':bt?P.navy:un?P.navy:P.locked};box-shadow:${on?`0 8px 20px ${P.green}55`:'none'};">
                ${bt?'✓':x.id}
              </button>`;})}
          </div>

          <!-- habit card -->
          <div class="card" style="background:${isUn?P.greenPale:P.lockedBg};border:2.5px solid ${isUn?P.green:P.locked};">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
              <span style="display:inline-block;color:#fff;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;background:${isUn?P.green:P.locked};">${hab.phase}</span>
              ${btDn&&html`<span style="font-size:13px;font-weight:800;padding:4px 12px;border-radius:20px;background:${P.mintGreen}22;color:${P.mintGreen};">クリア済み</span>`}
              ${!isUn&&html`<span style="font-size:13px;font-weight:800;padding:4px 12px;border-radius:20px;background:${P.locked};color:#fff;">ロック中</span>`}
              ${isUn&&myDn&&!btDn&&html`<span style="font-size:13px;font-weight:800;padding:4px 12px;border-radius:20px;background:${P.goldPale};color:#C89800;">待機中</span>`}
            </div>
            <div style="font-size:40px;line-height:1;margin-bottom:4px;color:${P.navy};">${hab.icon}</div>
            <div style="font-size:22px;font-weight:900;color:${P.textDark};line-height:1.4;margin-bottom:4px;">${hab.title}</div>
            <div style="font-size:14px;color:${P.grayM};letter-spacing:.5px;margin-bottom:10px;">${hab.en}</div>
            <div style="font-size:16px;color:#4A5568;line-height:1.75;padding-top:10px;border-top:1.5px solid rgba(0,0,0,.07);">${hab.desc}</div>
          </div>

          <!-- locked -->
          ${!isUn&&html`<div style="text-align:center;padding:34px 20px;background:${P.lockedBg};border-radius:18px;margin-bottom:14px;border:2px dashed ${P.locked};">
            <div style="font-size:50px;">🔒</div>
            <div style="font-size:22px;font-weight:900;color:${P.grayM};margin:10px 0 6px;">まだロック中</div>
            <div style="font-size:17px;color:${P.grayM};line-height:1.7;">習慣${ah-1}をふたりでクリアすると解放されます！</div>
          </div>`}

          <!-- active -->
          ${isUn&&!btDn&&!myDn&&html`<div>
            <!-- step card -->
            <div class="card">
              <div class="step-row">
                ${hab.levels.map((lx,i)=>html`
                  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
                    <div class="step-dot" style="background:${i<=lv?P.green:P.grayL};border:${i===lv?`3px solid ${P.green}`:'3px solid transparent'};box-shadow:${i===lv?`0 0 0 5px ${P.greenPale}`:'none'};">
                      ${i<lv?'✓':i+1}
                    </div>
                    <span style="font-size:11px;font-weight:700;color:${i<=lv?P.green:P.grayM};">${lx.step}</span>
                    <span style="font-size:10px;color:${i===lv?P.green:P.grayM};text-align:center;line-height:1.3;">${lx.label}</span>
                  </div>`)}
              </div>
              ${USERS.map(u=>{const ul=getLevel(pr,u.id,ah),us=calcStreak(ch,u.id,ah,ul),ud=pr[`${u.id}_${ah}_complete`];return html`
                <div class="streak-bar">
                  <div class="streak-name" style="background:${u.color};color:${u.tc};">${u.name}</div>
                  <div class="streak-dots">
                    ${[...Array(7)].map((_,d)=>html`<div class="streak-dot" style="background:${ud?P.green:d<us?P.green:P.grayL};"></div>`)}
                  </div>
                  <span style="font-size:16px;font-weight:900;min-width:52px;text-align:right;color:${ud?P.green:P.navy};">${ud?'完了！':`${us}/7`}</span>
                </div>`;})}
            </div>
            <!-- check card -->
            <div class="card" style="border:2.5px solid ${P.green};">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <div>
                  <span style="font-size:19px;font-weight:900;color:${P.navy};">今日のチェック</span>
                  <span style="font-size:14px;color:${P.green};font-weight:700;margin-left:8px;">${hab.levels[lv]?.label}</span>
                </div>
                <span style="font-size:16px;font-weight:900;color:#fff;padding:4px 14px;border-radius:20px;background:${P.green};">${its.filter((_,i)=>isCh(ah,lv,i)).length}/${its.length}</span>
              </div>
              ${its.map((item,i)=>{
                const dn=isCh(ah,lv,i),txt=typeof item==='string'?item:item.text,tg=typeof item==='string'?null:item.tag,ti=tg?tagInfo(tg):null;
                return html`
                  <button class="check-item" onClick=${()=>toggle(ah,lv,i)}
                    style="background:${dn?P.greenPale:P.white};border-color:${dn?P.green:P.grayL};">
                    <div class="check-circle" style="background:${dn?P.green:'transparent'};border-color:${dn?P.green:P.grayM};">${dn?'✓':''}</div>
                    <div style="flex:1;text-align:left;">
                      ${tg&&html`<span class="tag-badge" style="background:${ti.bg};color:${ti.col};">${ti.lbl}</span>`}
                      <div style="font-size:17px;color:${dn?P.textDark:'#444'};line-height:1.7;font-weight:${dn?700:400};">${txt}</div>
                    </div>
                  </button>`;})}
              ${tdDn&&html`<div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;margin-top:10px;background:${P.green};">
                <span style="font-size:20px;font-weight:900;color:#fff;">${sk}日連続！あと${Math.max(0,7-sk)}日でレベルアップ</span>
              </div>`}
            </div>
          </div>`}

          <!-- waiting -->
          ${isUn&&myDn&&!btDn&&html`<div style="text-align:center;padding:32px 20px;border-radius:18px;margin-bottom:14px;background:${P.goldPale};border:2.5px solid ${P.gold};">
            <div style="font-size:24px;font-weight:900;color:${P.navy};margin-bottom:8px;">${meU.name}さんはクリア！</div>
            <div style="font-size:17px;color:${P.navy};line-height:1.7;">${pt.name}さんのクリアを待っています。一緒に突破しよう！</div>
          </div>`}

          <!-- both done -->
          ${isUn&&btDn&&html`<div style="text-align:center;padding:36px 20px;border-radius:18px;margin-bottom:14px;background:${P.greenPale};border:2px solid ${P.green}66;">
            <div style="font-size:60px;">🎉</div>
            <div style="font-size:26px;font-weight:900;color:${P.navy};margin:8px 0 6px;">ふたりでクリア！</div>
            <div style="font-size:18px;color:${P.navy};line-height:1.7;margin-bottom:14px;">「${hab.title}」が身につきました！</div>
            ${ah<7&&html`<button onClick=${()=>sAh(ah+1)} style="padding:14px 28px;color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:900;background:${P.green};">習慣${ah+1}へ進む →</button>`}
            ${ah===7&&html`<div style="font-size:22px;font-weight:900;color:${P.coral};">全習慣マスター！！</div>`}
          </div>`}
        </div>`}

        <!-- WEEKLY -->
        ${tab==="weekly"&&html`<div>
          <div style="font-size:26px;font-weight:900;color:${P.navy};margin-bottom:4px;">週次レビュー</div>
          <div style="font-size:16px;color:${P.grayM};margin-bottom:18px;">7日連続チェックで次のステップへ！</div>
          ${H.map(x=>{const un=isUnlocked(pr,x.id),bt=pr[`both_${x.id}_complete`];return html`
            <div class="week-card" style="background:${bt?P.greenPale:un?P.white:P.lockedBg};border-color:${bt?P.green:un?P.green:P.locked};opacity:${un?1:.55};">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:${un&&!bt?'12px':'0'};">
                <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${bt?P.yellow:un?P.green:P.locked};font-weight:900;color:${bt?P.navy:'#fff'};font-size:17px;">${bt?'✓':x.id}</div>
                <div style="flex:1;">
                  <div style="font-size:18px;font-weight:800;color:${un?P.navy:P.locked};line-height:1.4;">${x.title}</div>
                  ${bt&&html`<div style="font-size:14px;color:${P.green};font-weight:700;margin-top:2px;">クリア済み</div>`}
                </div>
              </div>
              ${un&&!bt&&USERS.map(u=>{const ul=getLevel(pr,u.id,x.id),us=calcStreak(ch,u.id,x.id,ul),ud=pr[`${u.id}_${x.id}_complete`];return html`
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                  <div style="display:flex;align-items:center;justify-content:center;padding:5px 12px;border-radius:20px;flex-shrink:0;min-width:60px;background:${u.color};font-size:15px;font-weight:900;color:${u.tc};">${u.name}</div>
                  <div style="display:flex;gap:3px;flex:1;">${[...Array(7)].map((_,d)=>html`<div style="flex:1;height:14px;border-radius:3px;background:${ud?P.green:d<us?P.green:P.grayL};"></div>`)}</div>
                  <span style="font-size:16px;font-weight:900;min-width:52px;text-align:right;color:${ud?P.green:P.navy};">${ud?'完了！':`${us}/7`}</span>
                </div>`;})}
            </div>`;})}
          <div style="display:flex;align-items:flex-start;gap:14px;background:#FEFBE8;border-radius:16px;padding:18px 20px;margin-top:8px;border:2px solid ${P.yellow};">
            <span style="font-size:28px;">💡</span>
            <div style="font-size:17px;color:${P.navy};line-height:1.8;">ふたりとも<strong>7日連続</strong>チェックで次の習慣が解放されます。段階的に項目が増えていくので無理なく習慣が身につきます！</div>
          </div>
        </div>`}

        <!-- SHARE -->
        ${tab==="share"&&html`<div>
          <div style="font-size:26px;font-weight:900;color:${P.navy};margin-bottom:4px;">ふたりの記録</div>
          <div style="font-size:16px;color:${P.grayM};margin-bottom:18px;">今週の気づきをシェアしよう</div>
          <div class="card">
            <div style="font-size:18px;font-weight:900;color:${P.navy};margin-bottom:14px;">ジャーニー進捗</div>
            <div style="display:flex;gap:7px;">
              ${H.map(x=>{const bt=pr[`both_${x.id}_complete`],un=isUnlocked(pr,x.id);return html`
                <div style="flex:1;text-align:center;">
                  <div style="width:100%;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;background:${bt?P.yellow:un?P.greenPale:P.lockedBg};border:2.5px solid ${bt?P.yellow:un?P.green:P.locked};font-size:18px;font-weight:900;color:${bt?P.navy:un?P.navy:P.locked};">${bt?'✓':un?x.id:'🔒'}</div>
                  <div style="display:flex;justify-content:center;gap:2px;margin-top:4px;">
                    ${USERS.map(u=>html`<div style="width:7px;height:7px;border-radius:50%;background:${pr[`${u.id}_${x.id}_complete`]?P.green:P.grayL};"></div>`)}
                  </div>
                </div>`;})}
            </div>
            <div style="display:flex;gap:10px;margin-top:14px;">
              ${USERS.map(u=>{const cnt=H.filter(x=>pr[`${u.id}_${x.id}_complete`]).length;return html`
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 14px;border-radius:14px;flex:1;background:${u.color};">
                  <span style="font-size:18px;font-weight:900;color:${u.tc};">${u.name}</span>
                  <span style="font-size:16px;font-weight:700;color:${u.tc};opacity:.8;">${cnt}/7 クリア</span>
                </div>`;})}
            </div>
          </div>
          <div class="card">
            <div style="display:inline-flex;align-items:center;justify-content:center;padding:7px 16px;border-radius:20px;margin-bottom:12px;background:${meU.color};">
              <span style="font-size:17px;font-weight:900;color:${meU.tc};">${meU.name}として投稿</span>
            </div>
            <textarea value=${draft} onInput=${e=>sDraft(e.target.value)} placeholder="今週の気づき・うまくいったこと・難しかったこと..." style="border:2px solid ${P.grayL};min-height:100px;"></textarea>
            <button onClick=${postIns} style="margin-top:12px;width:100%;padding:14px;color:${meU.tc};border:none;border-radius:14px;font-size:18px;font-weight:900;background:${meU.color};">シェアする</button>
          </div>
          ${USERS.map(u=>{const posts=[...(ins[`${u.id}_${wkey}`]||[])].reverse();return html`
            <div>
              <div style="display:inline-block;color:#fff;font-size:15px;font-weight:800;padding:6px 18px;border-radius:20px;margin:16px 0 12px;background:${u.color};">${u.name}の気づき</div>
              ${posts.length===0
                ?html`<div style="font-size:16px;color:${P.grayM};text-align:center;padding:16px 0;">まだ投稿がありません</div>`
                :posts.map((p,i)=>html`
                  <div key=${i} class="card" style="border:2.5px solid ${u.color};margin-bottom:10px;">
                    <div style="font-size:17px;color:${P.textDark};line-height:1.75;">${p.text}</div>
                    <div style="font-size:13px;color:${P.grayM};margin-top:8px;">${fd(p.ts)}</div>
                  </div>`)}
            </div>`;} )}
        </div>`}

        <!-- MISSION -->
        ${tab==="mission"&&html`<${MissionTab} me=${me} msn=${msn} mqi=${mqi} md=${md} setMqi=${sMqi} setMd=${sMd} saveMsn=${saveMsn} meU=${meU} pt=${pt}/>`}
      </div>

      <!-- UNLOCK POPUP -->
      ${pop&&html`
        <div class="overlay" onClick=${()=>sPop(null)}>
          <div class="pop-box" onClick=${e=>e.stopPropagation()}>
            <div class="pop-bar">習慣${pop}が解放！</div>
            <div class="pop-body">
              <div style="font-size:22px;font-weight:900;color:${P.navy};margin-bottom:8px;">${H.find(x=>x.id===pop)?.title}</div>
              <div style="font-size:17px;color:${P.navy};line-height:1.7;margin-bottom:24px;">ふたりで次のステージへ進みましょう！</div>
              <button onClick=${()=>{sPop(null);sAh(pop);sTab("today");}} style="width:100%;padding:14px;background:${P.navy};color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:900;">さっそく始める！</button>
            </div>
          </div>
        </div>`}

      <!-- TOAST -->
      ${toast&&html`<div class="toast-el">${toast}</div>`}
    </div>`;
}

// ── Mission tab component ─────────────────────────────────────────────────────
function MissionTab({me,msn,mqi,md,setMqi,setMd,saveMsn,meU,pt}){
  const um=msn[me]||{};
  const answered=MQ.filter(q=>um[q.id]?.trim()).length;
  const allDn=answered===MQ.length;
  const curQ=MQ[mqi];
  const saved=um[curQ?.id]||"";
  const saveAns=()=>{
    if(!md.trim())return;
    const nx={...msn,[me]:{...um,[curQ.id]:md.trim()}};
    saveMsn(nx);setMd("");
    if(mqi<MQ.length-1)setMqi(mqi+1);
  };
  return html`<div>
    <div style="font-size:26px;font-weight:900;color:${P.navy};margin-bottom:4px;">ミッションステートメント</div>
    <div style="font-size:16px;color:${P.grayM};margin-bottom:18px;">完璧を目指さなくていい。今の自分の言葉で。</div>
    <div style="background:${P.greenPale};border-radius:14px;padding:14px 16px;margin-bottom:18px;border-left:4px solid ${P.green};">
      <div style="font-size:14px;font-weight:800;color:${P.green};margin-bottom:8px;">📝 いつ書く？</div>
      <div style="font-size:15px;color:${P.navy};display:flex;flex-direction:column;gap:7px;">
        <span>✅ 今すぐ問1〜2だけ書いてみよう</span>
        <span>✅ 習慣1クリアで草案としてまとめる</span>
        <span>✅ 習慣2に入ったら毎日読み返す</span>
        <span style="color:${P.grayM};font-size:13px;">※完成させなくてOK。人生と一緒に育てていくものです。</span>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:15px;font-weight:700;color:${P.navy};">${meU.name}さんの進捗</span>
        <span style="font-size:15px;font-weight:700;color:${P.green};">${answered} / ${MQ.length} 問</span>
      </div>
      <div class="msn-bar"><div class="msn-fill" style="width:${answered/MQ.length*100}%;"></div></div>
      ${allDn&&html`<div style="margin-top:10px;font-size:15px;color:${P.green};font-weight:700;text-align:center;">草案が完成しました！いつでも編集できます。</div>`}
    </div>
    ${!allDn&&html`<div class="card" style="border:2px solid ${P.greenPale};">
      <div style="display:flex;gap:5px;margin-bottom:16px;">
        ${MQ.map((q,i)=>html`
          <button onClick=${()=>{setMqi(i);setMd(um[q.id]||'');}} style="flex:1;height:6px;border-radius:3px;border:none;cursor:pointer;background:${um[q.id]?P.green:i===mqi?P.navy:P.grayL};"></button>`)}
      </div>
      <div style="font-size:12px;font-weight:800;color:${P.green};letter-spacing:1px;margin-bottom:8px;text-transform:uppercase;">${curQ.sec}</div>
      <div style="font-size:20px;font-weight:900;color:${P.navy};line-height:1.55;margin-bottom:10px;white-space:pre-line;">${curQ.q}</div>
      <div style="font-size:14px;color:${P.grayM};line-height:1.7;margin-bottom:14px;padding:10px 12px;background:${P.off};border-radius:10px;">${curQ.hint}</div>
      ${saved&&!md&&html`<div style="background:${P.greenPale};border-radius:12px;padding:14px 16px;margin-bottom:12px;">
        <div style="font-size:12px;color:${P.green};font-weight:700;margin-bottom:6px;">保存済みの回答</div>
        <div style="font-size:16px;color:${P.navy};line-height:1.7;">${saved}</div>
        <button onClick=${()=>setMd(saved)} style="margin-top:10px;font-size:13px;font-weight:700;color:${P.green};background:transparent;border:1.5px solid ${P.green};border-radius:8px;padding:5px 14px;">編集する</button>
      </div>`}
      ${(!saved||md)&&html`<div>
        <textarea value=${md} onInput=${e=>setMd(e.target.value)} placeholder=${curQ.ph} style="border:2px solid ${P.grayL};min-height:110px;"></textarea>
        <div style="display:flex;gap:10px;margin-top:12px;">
          ${mqi>0&&html`<button onClick=${()=>{setMqi(mqi-1);setMd(um[MQ[mqi-1].id]||'');}} style="padding:12px 18px;background:${P.off};color:${P.navy};border:2px solid ${P.grayL};border-radius:12px;font-size:16px;font-weight:700;">← 前へ</button>`}
          <button onClick=${saveAns} style="flex:1;padding:13px;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:900;background:${md.trim()?P.navy:P.locked};">
            ${mqi<MQ.length-1?'保存して次へ →':'草案を完成させる'}
          </button>
        </div>
      </div>`}
    </div>`}
    ${answered>0&&html`<div>
      <div style="display:inline-block;color:#fff;font-size:15px;font-weight:800;padding:6px 18px;border-radius:20px;margin:4px 0 14px;background:${P.navy};">これまでの回答</div>
      ${MQ.map(q=>{
        const ans=um[q.id];
        if(!ans)return null;
        return html`<div class="card" style="border:2px solid ${P.greenPale};position:relative;margin-bottom:10px;">
          <div style="font-size:11px;font-weight:800;color:${P.green};letter-spacing:1px;margin-bottom:4px;">${q.sec}</div>
          <div style="font-size:13px;color:${P.grayM};margin-bottom:8px;">${q.q.split('\n')[0]}</div>
          <div style="font-size:17px;color:${P.navy};line-height:1.75;padding-right:44px;">${ans}</div>
          <button onClick=${()=>{const idx=MQ.findIndex(x=>x.id===q.id);setMqi(idx);setMd(ans);}} style="position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;color:${P.navy};background:${P.off};border:1.5px solid ${P.grayL};border-radius:8px;padding:4px 10px;">編集</button>
        </div>`;})}
    </div>`}
    ${msn[pt.id]?.free&&html`<div>
      <div style="display:inline-block;color:#fff;font-size:15px;font-weight:800;padding:6px 18px;border-radius:20px;margin:16px 0 14px;background:${pt.color};">${pt.name}さんのミッション草案</div>
      <div class="card" style="border:2.5px solid ${pt.color};">
        <div style="font-size:17px;color:${P.navy};line-height:1.8;">${msn[pt.id].free}</div>
      </div>
    </div>`}
  </div>`;
}

render(html`<${App}/>`, document.getElementById('app'));
</script>
</body>
</html>
